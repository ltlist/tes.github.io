<!DOCTYPE html><html>
<head>
<meta charset="UTF-8">
<title>Test Apps Script</title>
</head>
<body><button onclick="testAdd()">TEST ADD</button>

<pre id="hasil"></pre><script>
const API =
"https://script.google.com/macros/s/AKfycbyi-AhsKNTbctSLL-gAok78XZEN7M1t2OS3X0-ufNUpzmyyOi2CyABvRFdEnEf4oSck/exec";

async function testAdd(){

  try{

    const res = await fetch(API,{
      method:"POST",
      headers:{
        "Content-Type":"application/json"
      },
      body:JSON.stringify({
        password:"ltlis123",
        action:"add",
        id:999,
        name:"TEST",
        coin:"MULTI",
        link:"https://example.com",
        cooldown:1
      })
    });

    const data = await res.text();

    document.getElementById("hasil").textContent = data;

  }catch(err){

    document.getElementById("hasil").textContent =
      "ERROR: " + err;

  }

}
</script></body>
</html>
